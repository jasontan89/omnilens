<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="omniGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with dark sleek tint -->
  <rect width="192" height="192" rx="44" fill="#090a0f" />
  <rect width="190" height="190" x="1" y="1" rx="43" fill="none" stroke="url(#omniGrad192)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Outer Aura Ring -->
  <circle cx="96" cy="96" r="62" stroke="url(#glowGrad192)" stroke-width="5" fill="none" filter="url(#glow192)" />
  
  <!-- Core Lens Ring -->
  <circle cx="96" cy="96" r="56" stroke="url(#omniGrad192)" stroke-width="12" fill="none" />
  
  <!-- Optical Iris Shutter Blades -->
  <circle cx="96" cy="96" r="34" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity="0.75" />
  
  <!-- Central Pupil / AI Spark -->
  <circle cx="96" cy="96" r="22" fill="url(#omniGrad192)" />
  <circle cx="88" cy="88" r="6" fill="#ffffff" opacity="0.8" />
  
  <!-- 4 Directional Vision Focus Marks -->
  <path d="M 96 22 L 96 32 M 96 160 L 96 170 M 22 96 L 32 96 M 160 96 L 170 96" stroke="url(#omniGrad192)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>